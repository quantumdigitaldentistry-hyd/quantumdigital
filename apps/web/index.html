<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quantum Digital Dentistry</title>
    <meta
      name="description"
      content="Implants, Invisalign, laser dentistry and smile design at Quantum Digital Dentistry."
    />
    <meta name="theme-color" content="#f4f8fa" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Set the theme before first paint so there is no light flash in dark mode.
      Saved choice wins, otherwise follow the device. Kept in sync by src/lib/theme.ts.
    -->
    <script>
      (function () {
        var mode = 'system';
        try {
          mode = localStorage.getItem('qd-theme') || 'system';
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Quantum Digital Dentistry needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
